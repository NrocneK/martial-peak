<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: chặn zoom khi chạm hai lần trên điện thoại -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Vạn Giới Tầm Quang</title>
    <!-- Favicon rỗng: tránh trình duyệt tự xin /favicon.ico rồi báo lỗi 404 -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0a12;
        /* Chặn cuộn / kéo-thả của trình duyệt để joystick cảm ứng hoạt động mượt */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        /* dvh: chiều cao thật khi thanh địa chỉ trên điện thoại ẩn/hiện (trình duyệt cũ bỏ qua) */
        height: 100dvh;
      }
      canvas {
        display: block;
      }
      /* ---------- Màn nạp: hiện ngay khi trang mở, trước cả khi mã game tải xong ---------- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 46%, #1a2140 0%, #090c18 70%);
        color: #a7adbf;
        font-family: 'Be Vietnam Pro', 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.6s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: min(340px, 84vw);
        text-align: center;
      }
      #boot .lamp {
        width: 104px;
        height: 144px;
        background: url('/ui/lantern.png') 0 0 / 832px 144px no-repeat;
        image-rendering: pixelated;
        animation: lamp 1s steps(8) infinite;
        filter: drop-shadow(0 0 22px #ffbf5e99);
      }
      @keyframes lamp {
        to {
          background-position: -832px 0;
        }
      }
      #boot .name {
        font-family: 'Noto Serif', Georgia, serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.14em;
        color: #ffbf5e;
      }
      #boot .track {
        width: 100%;
        height: 3px;
        background: #1a2140;
        overflow: hidden;
      }
      #boot .track i {
        display: block;
        width: 40%;
        height: 100%;
        background: #ffbf5e;
        animation: sweep 1.3s ease-in-out infinite;
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      #boot .tip {
        min-height: 2.6em;
        font-size: 13px;
        line-height: 1.5;
        color: #7f869c;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .lamp,
        #boot .track i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot" aria-live="polite">
      <div class="wrap">
        <div class="lamp"></div>
        <div class="name">VẠN GIỚI TẦM QUANG</div>
        <div class="track"><i></i></div>
        <div class="tip" id="boot-tip">Đang thắp đèn…</div>
      </div>
    </div>
    <!-- Lớp giao diện HTML (menu, HUD, thẻ kỹ năng...) nằm đè lên canvas game -->
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
