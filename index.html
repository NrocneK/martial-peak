<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: chặn zoom khi chạm hai lần trên điện thoại -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Vạn Giới Tầm Quang</title>
    <!-- Favicon rỗng: tránh trình duyệt tự xin /favicon.ico rồi báo lỗi 404 -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0a12;
        /* Chặn cuộn / kéo-thả của trình duyệt để joystick cảm ứng hoạt động mượt */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        /* Không cho trình duyệt di động tự phóng to chữ (font boosting) làm vỡ bố cục */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #game {
        width: 100vw;
        height: 100vh;
        /* dvh: chiều cao thật khi thanh địa chỉ trên điện thoại ẩn/hiện (trình duyệt cũ bỏ qua) */
        height: 100dvh;
      }
      canvas {
        display: block;
      }
      /* ---------- Màn nạp: hiện ngay khi trang mở, trước cả khi mã game tải xong ---------- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: url('/ui/sect_wide.png') 50% 70% / cover no-repeat #2763d0;
        image-rendering: pixelated;
        color: #e9edff;
        font-family: 'Be Vietnam Pro', 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.6s ease;
      }
      #boot::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(8, 14, 44, 0.72), rgba(8, 14, 44, 0.55) 50%, rgba(8, 14, 44, 0.8));
      }
      @media (max-aspect-ratio: 1/1) {
        #boot {
          background-image: url('/ui/sect_tall.png');
          background-position: 50% 100%;
        }
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(360px, 86vw);
        text-align: center;
      }
      #boot .name {
        font-family: 'Noto Serif', Georgia, serif;
        font-weight: 800;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: 0.08em;
        color: #ffd96a;
        text-shadow: 0 3px 0 #14224f, 0 0 18px rgba(255, 217, 106, 0.45);
      }
      /* Cố Trường Ca đi bộ tại chỗ: dải 4 khung 21x38, phóng 4 lần */
      #boot .walker {
        width: 84px;
        height: 152px;
        background: url('/ui/hero_walk.png?v=0.9.5') 0 0 / 336px 152px no-repeat;
        image-rendering: pixelated;
        animation: walk 0.5s steps(4) infinite;
        filter: drop-shadow(0 6px 0 rgba(8, 14, 44, 0.5));
      }
      @keyframes walk {
        to {
          background-position: -336px 0;
        }
      }
      #boot .track {
        width: 100%;
        height: 8px;
        background: #0a1030;
        border: 2px solid #e8b24a;
        box-shadow: 0 0 0 2px #0a1030;
        overflow: hidden;
      }
      #boot .track i {
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(180deg, #fff0b0, #f2b23e);
        animation: sweep 1.3s ease-in-out infinite;
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      #boot .tip {
        min-height: 2.6em;
        font-size: 13px;
        line-height: 1.5;
        color: #cfdcff;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .walker,
        #boot .track i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot" aria-live="polite">
      <div class="wrap">
        <div class="name">VẠN GIỚI<br />TẦM QUANG</div>
        <div class="walker" role="img" aria-label="Cố Trường Ca"></div>
        <div class="track"><i></i></div>
        <div class="tip" id="boot-tip">Đang mở cổng truyền tống…</div>
      </div>
    </div>
    <!-- Lớp giao diện HTML (menu, HUD, thẻ kỹ năng...) nằm đè lên canvas game -->
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
